name: Android CI validation

on:
  push:
    branches:
      - android-ci-validation
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  android:
    name: Build tinymesa for Android API ${{ matrix.api }} arm64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        api: [30]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup tinymesa
        uses: ./.github/actions/setup
      - name: Verify Android NDK
        shell: bash
        run: |
          test -x "${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ matrix.api }}-clang"
      - name: Clone mesa
        run: git clone --depth 1 --branch mesa-25.2.7 https://gitlab.freedesktop.org/mesa/mesa.git ${{ github.workspace }}/mesa
      - name: Patch mesa
        run: ./apply_patches.py ${{ github.workspace }}/mesa mesa-25.2.7
      - name: Build mesa
        shell: bash
        run: |
          export PATH="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          sed -E "s#(aarch64-linux-android)[0-9]+(-clang(\\+\\+)?)#\\1${{ matrix.api }}\\2#g" \
            android.ini > "android-${{ matrix.api }}.ini"
          cd ${{ github.workspace }}/mesa
          meson setup build/ --cross-file=${{ github.workspace }}/android-${{ matrix.api }}.ini -Db_staticpic=true -Dplatforms=android -Dplatform-sdk-version=${{ matrix.api }} -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Dgallium-drivers="[]" -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dllvm=disabled -Dshader-cache=disabled -Dzstd=disabled -Dzlib=disabled -Dopengl=false -Degl=disabled -Dgbm=disabled -Dvideo-codecs="[]"
          meson compile -C build tinymesa
      - name: Build wheel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG=(--tag "$GITHUB_REF_NAME")
          else
            VERSION_ARG=(--sha "${GITHUB_SHA::7}")
          fi

          ./build_wheel.py "${VERSION_ARG[@]}" \
            --platform android_${{ matrix.api }}_arm64_v8a \
            mesa-25.2.7 ${{ github.workspace }}/mesa/build/src/tinymesa/libtinymesa.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinymesa-android-api${{ matrix.api }}-arm64
          path: dist/
