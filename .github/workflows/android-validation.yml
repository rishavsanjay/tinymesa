name: Android CI validation

on:
  push:
    branches:
      - android-ci-validation
  workflow_dispatch:

jobs:
  arm64-emulator-probe:
    name: Probe arm64 Android emulator support
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Inspect runner virtualization and Android tooling
        shell: bash
        run: |
          set -euxo pipefail
          uname -m
          uname -a
          id
          ls -l /dev/kvm || true
          test -c /dev/kvm && echo "kvm_device=true" || echo "kvm_device=false"
          test -r /dev/kvm && echo "kvm_readable=true" || echo "kvm_readable=false"
          test -w /dev/kvm && echo "kvm_writable=true" || echo "kvm_writable=false"
          command -v emulator || true
          command -v sdkmanager || true
          ls -ld /usr/local/lib/android/sdk || true

  android:
    name: Build tinymesa mesa-25.2.7 on Android arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup tinymesa
        uses: ./.github/actions/setup
      - name: Verify Android NDK
        shell: bash
        run: |
          test -x "${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
      - name: Clone mesa
        run: git clone --depth 1 --branch mesa-25.2.7 https://gitlab.freedesktop.org/mesa/mesa.git ${{ github.workspace }}/mesa
      - name: Patch mesa
        run: ./apply_patches.py ${{ github.workspace }}/mesa mesa-25.2.7
      - name: Build mesa
        shell: bash
        run: |
          export PATH="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd ${{ github.workspace }}/mesa
          meson setup build/ --cross-file=${{ github.workspace }}/android.ini -Db_staticpic=true -Dplatforms=android -Dplatform-sdk-version=24 -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Dgallium-drivers="[]" -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dllvm=disabled -Dshader-cache=disabled -Dzstd=disabled -Dzlib=disabled -Dopengl=false -Degl=disabled -Dgbm=disabled -Dvideo-codecs="[]"
          meson compile -C build tinymesa
      - name: Build wheel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG=(--tag "$GITHUB_REF_NAME")
          else
            VERSION_ARG=(--sha "${GITHUB_SHA::7}")
          fi

          ./build_wheel.py "${VERSION_ARG[@]}" \
            --platform android_24_arm64_v8a \
            mesa-25.2.7 ${{ github.workspace }}/mesa/build/src/tinymesa/libtinymesa.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinymesa-whl-mesa-25.2.7-android-arm64-v8a-validation
          path: dist/
