name: Mesa consumer fork CI
on:
  push:
    branches: [ci/mesa-25-26-minimal-20261022]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONFAULTHANDLER: 1
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1
  TEST_TIMEOUT: 180
  NULL_ALLOW_COPYOUT: 1
defaults:
  run:
    shell: bash
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mesa: ['25.2.7', '26.2.5']
    env:
      EXPECTED_MESA: ${{ matrix.mesa }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: rishavsanjay/tinygrad
          ref: d6f046a59573808125555a72088dbde6212cf730
      - uses: ./.github/actions/setup-tinygrad
        with:
          python-version: '3.12'
          deps: testing_unit
          llvm: 'true'
      - name: Install wheel from Tinymesa fork CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '39656093669' --repo rishavsanjay/tinymesa --name 'tinymesa-whl-mesa-${{ matrix.mesa }}-ubuntu-22.04' --dir wheel
          uv pip install --no-deps wheel/*.whl
      - name: Verify ABI and library provenance
        env:
          DEV: CPU:LVP
        run: |
          mkdir results
          python - <<'PY' | tee results/provenance.json
          import hashlib, importlib.metadata, json, os, pathlib
          from tinygrad.runtime.autogen import mesa
          from tinygrad.runtime.support import mesa_abi
          assert mesa_abi.MESA_VERSION == os.environ['EXPECTED_MESA']
          assert 'MESA_PATH' not in os.environ and 'MESA_VERSION' not in os.environ
          assert not hasattr(mesa_abi.dll, 'tinymesa_mesa_version')
          library = pathlib.Path(mesa_abi.dll._name)
          print(json.dumps({'version': mesa_abi.MESA_VERSION, 'wheel': importlib.metadata.version('tinymesa'),
                            'library': str(library), 'sha256': hashlib.sha256(library.read_bytes()).hexdigest(),
                            'binding': mesa.nir_shader_create.__module__, 'embedded_marker': False}))
          PY
      - name: LVP operations
        env:
          DEV: CPU:LVP
          IMAGE: 0
          CACHEDB: ${{ runner.temp }}/lvp-ops.db
        run: python -m pytest test/runtime/test_ops.py -x -q -n12 --max-worker-restart=0 --junitxml=results/lvp-ops.xml | tee results/lvp-ops.log
      - name: LVP runtime and loader tests
        env:
          DEV: CPU:LVP
          IMAGE: 0
          CACHEDB: ${{ runner.temp }}/lvp-runtime.db
        run: python -m pytest test/runtime/test_dtype.py test/runtime/test_dtype_alu.py test/runtime/test_uops.py test/runtime/test_jit.py test/device/qcom/test_qcom.py test/null/test_mesa_version.py -x -q -n12 --max-worker-restart=0 --junitxml=results/lvp-runtime.xml | tee results/lvp-runtime.log
      - name: NAK compilation
        env:
          DEV: NULL:NAK:sm_120
          IMAGE: 0
          CACHEDB: ${{ runner.temp }}/nak-ops.db
        run: python -m pytest test/runtime/test_ops.py test/null/test_compile_failures.py -x -q -n12 --max-worker-restart=0 --junitxml=results/nak-ops.xml | tee results/nak-ops.log
      - name: IR3 compilation
        env:
          DEV: NULL:IR3:a630,IMAGE_PITCH_ALIGNMENT=64
          IMAGE: 1
          CACHEDB: ${{ runner.temp }}/ir3-ops.db
        run: python -m pytest test/runtime/test_ops.py test/null/test_compile_failures.py -x -q -n12 --max-worker-restart=0 --junitxml=results/ir3-ops.xml | tee results/ir3-ops.log
      - name: Check standalone library selection
        run: |
          python - <<'PY'
          import importlib.metadata, json, os, pathlib, shutil, subprocess, sys, tempfile
          package = pathlib.Path(importlib.metadata.distribution('tinymesa').locate_file('tinymesa'))
          version = os.environ['EXPECTED_MESA']
          records = []
          code = """import json, os
          from tinygrad import Tensor, dtypes
          from tinygrad.runtime.support.mesa_abi import MESA_VERSION, dll
          assert MESA_VERSION == os.environ['EXPECTED_MESA']
          assert dll._name == os.environ['MESA_PATH']
          assert not hasattr(dll, 'tinymesa_mesa_version')
          output = (Tensor([1., 2., 3.], dtype=dtypes.float32) * 2 + 1).realize()
          if not os.environ['DEV'].startswith('NULL'): assert output.numpy().tolist() == [3., 5., 7.]
          print(json.dumps({'version': MESA_VERSION, 'library': dll._name, 'dev': os.environ['DEV']}))
          """
          with tempfile.TemporaryDirectory() as directory:
            for name in ('libtinymesa.so', 'libtinymesa_cpu.so'): shutil.copy2(package/name, pathlib.Path(directory)/name)
            for dev, name in [('CPU:LVP', 'libtinymesa_cpu.so'), ('NULL:NAK:sm_120', 'libtinymesa.so'),
                              ('NULL:IR3:a630,IMAGE_PITCH_ALIGNMENT=64', 'libtinymesa.so')]:
              env = {**os.environ, 'DEV': dev, 'MESA_PATH': str(pathlib.Path(directory)/name),
                     'IMAGE': '1' if 'IR3' in dev else '0', 'CACHEDB': directory+'/cache.db'}
              env.pop('MESA_VERSION', None)
              if version == '26.2.5':
                result = subprocess.run([sys.executable, '-c', 'from tinygrad.runtime.support import mesa_abi'],
                                        env=env, capture_output=True, text=True)
                assert result.returncode != 0 and 'unidentified' in result.stderr, result.stderr
                env['MESA_VERSION'] = version
              result = subprocess.run([sys.executable, '-c', code], env=env, capture_output=True, text=True)
              assert result.returncode == 0, result.stdout+result.stderr
              record = json.loads(result.stdout.strip().splitlines()[-1])
              record['explicit_version'] = 'MESA_VERSION' in env
              records.append(record)
          pathlib.Path('results/standalone.json').write_text(json.dumps(records, indent=2))
          print(json.dumps(records))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-results-${{ matrix.mesa }}
          path: results/
