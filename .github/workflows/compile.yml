name: QCOM MockGPU IR3 host tinymesa

on:
  push:
    branches: [qcom-mockgpu-ir3-host]

jobs:
  ir3-host:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup tinymesa
        uses: ./.github/actions/setup
      - name: Clone Mesa 26.2.1
        run: git clone --depth 1 --branch mesa-26.2.1 https://gitlab.freedesktop.org/mesa/mesa.git ${{ github.workspace }}/mesa
      - name: Patch Mesa
        run: ./apply_patches.py ${{ github.workspace }}/mesa mesa-26.2.1
      - name: Configure IR3-only Mesa
        shell: bash
        run: |
          cd ${{ github.workspace }}/mesa
          meson setup build/ \
            -Db_staticpic=true \
            -Dgallium-drivers="[]" \
            -Dplatforms="[]" \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dvideo-codecs="[]"
      - name: Build tinymesa
        run: meson compile -C ${{ github.workspace }}/mesa/build tinymesa
      - name: Build wheel
        run: |
          ./build_wheel.py --sha "${GITHUB_SHA::7}" \
            --platform manylinux_2_32_x86_64 \
            mesa-26.2.1 ${{ github.workspace }}/mesa/build/src/tinymesa/libtinymesa.so
      - name: Test loading with ctypes
        run: |
          pip install dist/*.whl
          python3 -c "from ctypes import CDLL; from tinymesa import libtinymesa; CDLL(libtinymesa).glsl_type_singleton_init_or_ref()"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: tinymesa-ir3-mesa-26.2.1-x86_64
          path: dist/*.whl
