name: Compile tinymesa
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ir3-android:
    name: Mesa 26.3.1 IR3 for Android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up cross-build dependencies
        run: |
          python -m pip install meson ninja mako pyyaml packaging
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flex bison glslang-tools
          ndk="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          if [ ! -d "$ndk" ]; then sdkmanager 'ndk;29.0.14206865'; fi
          printf '%s\n' "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Fetch and verify Mesa
        run: |
          curl -fLsS --retry 3 https://archive.mesa3d.org/mesa-26.3.1.tar.xz -o mesa.tar.xz
          printf '%s  %s\n' 4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961 mesa.tar.xz | sha256sum -c
          tar -xf mesa.tar.xz
          # The Darwin disk-cache patch and the NAK patch are outside this build.
          cp apply_patches.py apply_linux_ir3.py
          sed -i '/^for p in .*patches.*iterdir():/c\for p in ():' apply_linux_ir3.py
          ./apply_linux_ir3.py "$PWD/mesa-26.3.1" mesa-26.3.1
      - name: Build IR3 and verify the Android ELF
        run: |
          meson setup mesa-26.3.1/build mesa-26.3.1 --cross-file="$PWD/android.ini" \
            -Db_staticpic=true -Dbuildtype=release -Dplatforms=android -Dplatform-sdk-version=30 \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Dgallium-drivers='[]' \
            -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dllvm=disabled \
            -Dshader-cache=disabled -Dzstd=disabled -Dzlib=disabled -Dopengl=false \
            -Degl=disabled -Dgbm=disabled -Dvideo-codecs='[]'
          meson compile -C mesa-26.3.1/build tinymesa
          mkdir artifact
          cp mesa-26.3.1/build/src/tinymesa/libtinymesa.so artifact/
          cd artifact
          llvm-readelf -h libtinymesa.so
          llvm-readelf -h libtinymesa.so | grep 'Machine:.*AArch64'
          sha256sum libtinymesa.so > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tinymesa-mesa-26.3.1-android-arm64-v8a
          path: artifact/
          if-no-files-found: error
