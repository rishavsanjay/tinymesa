name: Compile tinymesa

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'meson.build'
    tags:
      - 'v*'
      - 'rusticl*'
  pull_request:

jobs:
  rusticl:
    name: Build rusticl ${{ matrix.tag }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        tag: [ mesa-26.1.4 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup tinymesa
        uses: ./.github/actions/setup
        with:
          build-libclc: true
      - name: Clone mesa
        run: git clone --depth 1 --branch ${{ matrix.tag }} https://gitlab.freedesktop.org/mesa/mesa.git ${{ github.workspace }}/mesa
      - name: Build mesa
        id: build
        shell: bash
        run: |
          cd ${{ github.workspace }}/mesa
          export CLANG_PATH=$(which clang-20)
          meson setup build/ -Dllvm=enabled -Dshared-llvm=disabled -Dstatic-libclc=all -Dgallium-drivers=llvmpipe -Dgallium-rusticl=true -Dglx=disabled -Dvulkan-drivers="[]" -Dopengl=false -Dplatforms="[]" -Degl=disabled -Dgbm=disabled -Dvideo-codecs="[]"
          meson compile -C build RusticlOpenCL
          echo "rusticl_path=$(meson introspect build/ --targets | jq -r '.[] | select(.name=="RusticlOpenCL") | .filename[0]')" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusticl-${{ matrix.tag }}-${{ matrix.os }}
          path: ${{ steps.build.outputs.rusticl_path }}

  release-rusticl:
    name: Release rusticl
    runs-on: ubuntu-22.04
    needs: rusticl
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rusticl')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rusticl-*
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME"

  tinymesa:
    name: Build tinymesa ${{ matrix.tag }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm, macos-14 ]
        tag: [ mesa-25.2.7 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup tinymesa
        uses: ./.github/actions/setup
      - name: Clone mesa
        run: git clone --depth 1 --branch ${{ matrix.tag }} https://gitlab.freedesktop.org/mesa/mesa.git ${{ github.workspace }}/mesa
      - name: Patch mesa
        run: ./apply_patches.py ${{ github.workspace }}/mesa ${{ matrix.tag }}
      - name: Build mesa
        shell: bash
        run: |
          cd ${{ github.workspace }}/mesa
          export CLANG_PATH=$(which clang-20)
          meson setup build/ -Db_staticpic=true -Dgallium-drivers=llvmpipe -Dplatforms="[]" -Dglx=disabled -Dvulkan-drivers=swrast,nouveau,freedreno -Dopengl=false -Degl=disabled -Dgbm=disabled -Dvideo-codecs="[]"
          meson compile -C build tinymesa tinymesa_cpu
      - name: Polyfill glibc
        if: runner.os == 'Linux'
        run: |
          # can't go earlier than 2.32 because of __libc_single_threaded@GLIBC_2.32
          polyfill-glibc --target-glibc=2.32 ${{ github.workspace }}/mesa/build/src/tinymesa/libtinymesa*.so
      - name: Build wheel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARG=(--tag "$GITHUB_REF_NAME")
          else
            VERSION_ARG=(--sha "${GITHUB_SHA::7}")
          fi

          ./build_wheel.py "${VERSION_ARG[@]}" \
            --platform ${{ matrix.os == 'ubuntu-22.04' && 'manylinux_2_32_x86_64' || matrix.os == 'ubuntu-22.04-arm' && 'manylinux_2_32_aarch64' || 'macosx_14_0_arm64' }} \
            ${{ matrix.tag }} ${{ github.workspace }}/mesa/build/src/tinymesa/libtinymesa*${{ runner.os == 'macOS' && '.dylib' || '.so' }}
      - name: Test loading with ctypes
        run: |
          pip install dist/*.whl
          python3 -c "from ctypes import CDLL; from tinymesa import libtinymesa, libtinymesa_cpu; CDLL(libtinymesa).glsl_type_singleton_init_or_ref(), CDLL(libtinymesa_cpu).glsl_type_singleton_init_or_ref()"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinymesa-whl-${{ matrix.tag }}-${{ matrix.os }}
          path: dist/
  android:
    name: Build tinymesa mesa-25.2.7 for Android arm64-v8a
    runs-on: ubuntu-22.04
    env:
      MESA_TAG: mesa-25.2.7
      ANDROID_API: '25'
      NDK_VERSION: 29.0.14206865
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup tinymesa
        uses: ./.github/actions/setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android
      - name: Install bindgen
        run: cargo install --locked --version 0.72.1 bindgen-cli
      - name: Clone mesa
        run: git clone --depth 1 --branch ${MESA_TAG} https://gitlab.freedesktop.org/mesa/mesa.git ${{ github.workspace }}/mesa
      - name: Build host mesa_clc
        run: |
          cd ${{ github.workspace }}/mesa
          export CLANG_PATH=$(which clang-20)
          meson setup build-compiler \
            -Dprefix=${{ runner.temp }}/mesa-compiler \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms="[]" \
            -Dgallium-drivers="[]" \
            -Dvulkan-drivers="[]" \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
          meson install -C build-compiler
          echo "${{ runner.temp }}/mesa-compiler/bin" >> "$GITHUB_PATH"
      - name: Patch mesa
        run: ./apply_patches.py ${{ github.workspace }}/mesa ${MESA_TAG}
      - name: Build Android wheel
        env:
          LIBCLANG_PATH: /usr/lib/llvm-20/lib
        run: |
          NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}
          TOOLCHAIN=${NDK}/toolchains/llvm/prebuilt/linux-x86_64
          cat > ${{ runner.temp }}/android-aarch64.ini <<EOF
          [binaries]
          ar = '${TOOLCHAIN}/bin/llvm-ar'
          c = '${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = ['${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '${TOOLCHAIN}/bin/llvm-strip'
          rust = ['rustc', '--target', 'aarch64-linux-android']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          bindgen_clang_arguments = ['-target', 'aarch64-linux-android', '--sysroot', '${TOOLCHAIN}/sysroot']
          EOF

          cd ${{ github.workspace }}/mesa
          export CLANG_PATH=$(which clang-20)
          meson setup build-android \
            --cross-file=${{ runner.temp }}/android-aarch64.ini \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_staticpic=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers="[]" \
            -Dvulkan-drivers=freedreno,nouveau \
            -Dfreedreno-kmds=kgsl \
            -Dallow-fallback-for=libdrm \
            -Dmesa-clc=system \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dvideo-codecs="[]"
          meson compile -C build-android tinymesa
          LIB=$(realpath "$(meson introspect build-android --targets | jq -er '.[] | select(.name=="tinymesa") | .filename[0]')")
          ${TOOLCHAIN}/bin/llvm-readelf -h "$LIB" | grep -q AArch64
          ${TOOLCHAIN}/bin/llvm-nm -D --defined-only "$LIB" | grep -q ' nak_compiler_create$'
          ${TOOLCHAIN}/bin/llvm-nm -D --defined-only "$LIB" | grep -q ' ir3_compile_shader_nir$'

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_ARG=(--tag "$GITHUB_REF_NAME"); else VERSION_ARG=(--sha "${GITHUB_SHA::7}"); fi
          cd ${{ github.workspace }}
          ./build_wheel.py "${VERSION_ARG[@]}" --platform android_${ANDROID_API}_arm64_v8a ${MESA_TAG} "$LIB"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinymesa-whl-mesa-25.2.7-android-arm64-v8a
          path: dist/

  release:
    name: Release tinymesa
    runs-on: ubuntu-22.04
    needs: [ tinymesa, android ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/tinymesa
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tinymesa-whl-*
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
